<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Notifications — PyDebug Admin</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-protected admin-panel-locked">

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-sidebar__logo">&gt;_ PyDebug</div>
    <div class="admin-sidebar__tag">ADMIN PANEL</div>
    <nav>
      <a href="dashboard.html" data-admin-nav="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="4" y2="12"/><line x1="10" y1="20" x2="10" y2="4"/><line x1="16" y1="20" x2="16" y2="14"/></svg> Dashboard</a>
      <a href="submissions.html" data-admin-nav="submissions.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg> Submissions</a>
      <a href="payments.html" data-admin-nav="payments.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg> Payments</a>
      <a href="discussions.html" data-admin-nav="discussions.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Discussions</a>
      <a href="notifications.html" data-admin-nav="notifications.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg> Notifications</a>
      <a href="ai.html" data-admin-nav="ai.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="8" height="8" rx="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg> AI Control</a>
<a href="problem-form.html" data-admin-nav="problem-form.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add Problem</a>
      <a href="users.html" data-admin-nav="users.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M2 20c0-3 3-5 7-5s7 2 7 5"/><circle cx="17" cy="8" r="2.5"/><path d="M17 14c2.5 0 5 1.5 5 4"/></svg> Users</a>
    </nav>
    <div class="admin-sidebar__account">
      <span id="admin-name">...</span>
      <button data-admin-logout aria-label="Log out" title="Log out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Notifications</h1>
    </div>

    <div id="notifications-hint"></div>

    <div class="admin-section-title" style="margin-top:0">Broadcast announcement</div>
    <p class="muted" style="font-size:0.85rem;margin-top:-8px">Appears in the 🔔 bell of every selected user in the user panel.</p>

    <form id="broadcast-form" class="admin-form" style="max-width:640px">
      <div class="field">
        <label for="broadcast-title">Title</label>
        <input type="text" id="broadcast-title" required maxlength="120" placeholder="e.g. 10 new hard problems are live!">
      </div>
      <div class="field">
        <label for="broadcast-message">Message</label>
        <textarea id="broadcast-message" required style="min-height:80px" maxlength="500" placeholder="Short message shown under the title..."></textarea>
      </div>
      <div class="form-row">
        <div class="field">
          <label for="broadcast-link">Link (optional)</label>
          <input type="text" id="broadcast-link" maxlength="200" placeholder="/problems.html">
        </div>
        <div class="field">
          <label for="broadcast-type">Icon</label>
          <select id="broadcast-type">
            <option value="announcement">📣 Announcement</option>
            <option value="new_problem">📝 New problem</option>
            <option value="leaderboard_rank">🏆 Leaderboard</option>
          </select>
        </div>
        <div class="field">
          <label for="broadcast-audience">Audience</label>
          <select id="broadcast-audience">
            <option value="all">All users</option>
            <option value="free">Free users only</option>
            <option value="premium">Premium users only</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn btn--primary" id="broadcast-send-btn">Send broadcast</button>
      <div class="broadcast-progress" id="broadcast-progress"></div>
    </form>

    <div class="admin-section-title">Recent notifications <span class="count" id="notif-count"></span></div>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Sent</th>
            <th>To</th>
            <th>Title</th>
            <th>Message</th>
            <th>Read</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="notifications-tbody"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/utils.js"></script>
<script src="js/admin-icons.js"></script>
<script src="js/admin-common.js"></script>
<script src="js/admin-notifications.js"></script>
</body>
</html>
