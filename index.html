<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Login — PyDebug</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0e14'/%3E%3Ctext x='16' y='22' font-size='16' font-family='monospace' fill='%23e3b341' text-anchor='middle'%3E%3E_%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<noscript>
  <div style="padding:24px;text-align:center;color:#f2545b;font-family:system-ui,sans-serif">
    This admin panel needs JavaScript enabled to load data from Supabase.
  </div>
</noscript>

<div class="auth-page">
  <div class="auth-card">
    <h1>PyDebug Admin</h1>
    <p class="subtitle">Restricted access — admin accounts only.</p>

    <form id="admin-login-form">
      <div class="field">
        <label for="admin-email">Email</label>
        <input type="email" id="admin-email" name="email" autocomplete="username" autocapitalize="none" spellcheck="false" required placeholder="admin@example.com">
      </div>
      <div class="field">
        <label for="admin-password">Password</label>
        <div class="password-field">
          <input type="password" id="admin-password" name="password" autocomplete="current-password" required placeholder="Your password">
          <button type="button" class="password-toggle-btn" data-toggle-password aria-label="Show password">Show</button>
        </div>
      </div>
      <button type="submit" class="btn btn--primary btn--full">Log in</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/utils.js"></script>
<script src="js/admin-login.js"></script>
</body>
</html>
