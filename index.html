<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d111a">
<meta name="robots" content="noindex, nofollow">
<title>Admin Login — PyDebug</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <h1>PyDebug Admin</h1>
    <p class="subtitle">Restricted access — admin accounts only.</p>

    <form id="admin-login-form">
      <div class="field">
        <label for="admin-email">Email</label>
        <input type="email" id="admin-email" required placeholder="admin@example.com">
      </div>
      <div class="field">
        <label for="admin-password">Password</label>
        <div class="password-field">
          <input type="password" id="admin-password" required placeholder="Your password">
          <button type="button" class="password-toggle-btn" data-toggle-password aria-label="Show password">Show</button>
        </div>
      </div>
      <button type="submit" class="btn btn--primary btn--full">Log in</button>
    </form>
  </div>
</div>

<script src="js/vendor/supabase.min.js" defer></script>
<script src="js/admin-boot.js" defer></script>
<script src="js/supabaseClient.js" defer></script>
<script src="js/admin-icons.js" defer></script>
<script src="js/utils.js" defer></script>
<script src="js/admin-login.js" defer></script>
</body>
</html>
