<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Login — PyDebug</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <h1>PyDebug Admin</h1>
    <p class="subtitle">Restricted access — admin accounts only.</p>

    <form id="admin-login-form">
      <div class="field">
        <label for="admin-email">Email</label>
        <input type="email" id="admin-email" required placeholder="admin@example.com">
      </div>
      <div class="field">
        <label for="admin-password">Password</label>
        <div class="password-field">
          <input type="password" id="admin-password" required placeholder="Your password">
          <button type="button" class="password-toggle-btn" data-toggle-password aria-label="Show password">Show</button>
        </div>
      </div>
      <button type="submit" class="btn btn--primary btn--full">Log in</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/utils.js"></script>
<script src="js/admin-login.js"></script>
</body>
</html>
