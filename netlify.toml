[build]
  command = "rm -rf _site && mkdir -p _site && cp *.html _site/ && cp -r css js _site/"
  publish = "_site"

# Defense-in-depth: block public HTTP access to .env*, .sql, .md, /db/*, and /tests/*
[[redirects]]
  from = "/.env*"
  to = "/__blocked__"
  status = 404
  force = true

[[redirects]]
  from = "/*.env*"
  to = "/__blocked__"
  status = 404
  force = true

[[redirects]]
  from = "/*.sql"
  to = "/__blocked__"
  status = 404
  force = true

[[redirects]]
  from = "/db/*"
  to = "/__blocked__"
  status = 404
  force = true

[[redirects]]
  from = "/*.md"
  to = "/__blocked__"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/__blocked__"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
