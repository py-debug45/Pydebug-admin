[build]
  command = "rm -rf _site && mkdir -p _site && cp *.html _site/ && cp -r css js _site/"
  publish = "_site"

# Defense-in-depth: block public HTTP access to .env*, .sql, .md, /db/*, and /tests/*
[[redirects]]
  from = "/.env*"
  to = "/__blocked__"
  status = 404
  force = true

[[redirects]]
  from = "/*.env*"
  to = "/__blocked__"
  status = 404
  force = true

[[redirects]]
  from = "/*.sql"
  to = "/__blocked__"
  status = 404
  force = true

[[redirects]]
  from = "/db/*"
  to = "/__blocked__"
  status = 404
  force = true

[[redirects]]
  from = "/*.md"
  to = "/__blocked__"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/__blocked__"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js https://unpkg.com/@supabase/supabase-js@2.117.2/dist/umd/supabase.js; style-src 'self' 'unsafe-inline'; connect-src 'self' https://cztosbchfqtyzxkhfrby.supabase.co wss://cztosbchfqtyzxkhfrby.supabase.co; img-src 'self' data: blob: https://cztosbchfqtyzxkhfrby.supabase.co; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=31536000"
