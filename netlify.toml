[build]
  command = "rm -rf _site && mkdir -p _site && cp *.html _site/ && cp -r css js _site/"
  publish = "_site"

# Defense-in-depth: block public HTTP access to .env*, .sql, .md, /db/*, and /tests/*
[[redirects]]
  from = "/.env*"
  to = "/__blocked__"
  status = 404
  force = true

[[redirects]]
  from = "/*.env*"
  to = "/__blocked__"
  status = 404
  force = true

[[redirects]]
  from = "/*.sql"
  to = "/__blocked__"
  status = 404
  force = true

[[redirects]]
  from = "/db/*"
  to = "/__blocked__"
  status = 404
  force = true

[[redirects]]
  from = "/*.md"
  to = "/__blocked__"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/__blocked__"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cache-Control = "no-cache, must-revalidate"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; worker-src 'self' blob:"

# Admin HTML is authenticated content: never let a shared device or a proxy
# serve it from cache after logout.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    Pragma = "no-cache"
