<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d111a">
<meta name="robots" content="noindex, nofollow">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-protected admin-panel-locked">

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-sidebar__logo">&gt;_ PyDebug</div>
    <div class="admin-sidebar__tag">ADMIN PANEL</div>
    <nav>
      <a href="dashboard.html" data-admin-nav="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="4" y2="12"/><line x1="10" y1="20" x2="10" y2="4"/><line x1="16" y1="20" x2="16" y2="14"/></svg> Dashboard</a>
      <a href="submissions.html" data-admin-nav="submissions.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg> Submissions</a>
      <a href="payments.html" data-admin-nav="payments.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg> Payments</a>
      <a href="discussions.html" data-admin-nav="discussions.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Discussions</a>
      <a href="notifications.html" data-admin-nav="notifications.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg> Notifications</a>
      <a href="ai.html" data-admin-nav="ai.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="8" height="8" rx="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg> AI Control</a>
<a href="problem-form.html" data-admin-nav="problem-form.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add Problem</a>
      <a href="users.html" data-admin-nav="users.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M2 20c0-3 3-5 7-5s7 2 7 5"/><circle cx="17" cy="8" r="2.5"/><path d="M17 14c2.5 0 5 1.5 5 4"/></svg> Users</a>
    </nav>
    <div class="admin-sidebar__account">
      <span id="admin-name">...</span>
      <button data-admin-logout aria-label="Log out" title="Log out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1 id="form-title">Add New Problem</h1>
      <a href="dashboard.html" class="btn btn--secondary">← Back to list</a>
    </div>

    <form id="problem-form" class="admin-form">
      <div class="form-row">
        <div class="field">
          <label for="problem-type">Type</label>
          <select id="problem-type">
            <option value="bug">Fix the Bug</option>
            <option value="question">Predict Output</option>
          </select>
        </div>
        <div class="field">
          <label for="problem-difficulty-input">Difficulty</label>
          <select id="problem-difficulty-input">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="problem-title-input">Title</label>
        <input type="text" id="problem-title-input" required placeholder="e.g. Off-by-one loop error">
      </div>

      <div class="field">
        <label for="problem-description">Description</label>
        <textarea id="problem-description" style="min-height:80px" placeholder="What the user needs to do..."></textarea>
      </div>

      <div class="form-row">
        <div class="field">
          <label for="problem-topic-input">Topic</label>
          <select id="problem-topic-input">
            <option value="loops">Loops</option>
            <option value="strings">Strings</option>
            <option value="lists">Lists</option>
            <option value="dictionaries">Dictionaries</option>
            <option value="functions">Functions</option>
            <option value="oop">OOP</option>
            <option value="recursion">Recursion</option>
            <option value="exceptions">Exceptions</option>
            <option value="sets">Sets</option>
            <option value="sorting">Sorting</option>
            <option value="generators">Generators</option>
            <option value="tuples">Tuples</option>
          </select>
        </div>
        <div class="field">
          <label for="problem-number-input">Problem number</label>
          <input type="number" id="problem-number-input" min="1" step="1" placeholder="e.g. 120">
        </div>
        <div class="field checkbox-field" style="align-self:end;padding-bottom:10px">
          <input type="checkbox" id="problem-premium">
          <label for="problem-premium" style="margin:0">Mark as Premium</label>
        </div>
      </div>

      <div class="field">
        <label id="starter-code-label" for="starter-code">Code</label>
        <textarea id="starter-code" required placeholder="def example():&#10;    pass"></textarea>
      </div>

      <div class="field">
        <label id="expected-output-label" for="expected-output">Expected output</label>
        <textarea id="expected-output" required style="min-height:80px" placeholder="Exact output text..."></textarea>
      </div>

      <div class="field">
        <label>Hints</label>
        <div id="hints-container"></div>
        <button type="button" id="add-hint-btn" class="btn btn--secondary btn--sm">+ Add hint</button>
      </div>

      <button type="submit" class="btn btn--primary">Save Problem</button>
    </form>
  </main>
</div>

<script src="js/vendor/supabase.min.js" defer></script>
<script src="js/admin-boot.js" defer></script>
<script src="js/supabaseClient.js" defer></script>
<script src="js/utils.js" defer></script>
<script src="js/admin-icons.js" defer></script>
<script src="js/admin-common.js" defer></script>
<script src="js/admin-problem-form.js" defer></script>
</body>
</html>
