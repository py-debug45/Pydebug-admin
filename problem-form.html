<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Add/Edit Problem — PyDebug Admin</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-sidebar__logo">&gt;_ PyDebug</div>
    <div class="admin-sidebar__tag">ADMIN PANEL</div>
    <nav>
      <a href="dashboard.html" data-admin-nav="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="4" y2="12"/><line x1="10" y1="20" x2="10" y2="4"/><line x1="16" y1="20" x2="16" y2="14"/></svg> Dashboard</a>
      <a href="problem-form.html" data-admin-nav="problem-form.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add Problem</a>
      <a href="users.html" data-admin-nav="users.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M2 20c0-3 3-5 7-5s7 2 7 5"/><circle cx="17" cy="8" r="2.5"/><path d="M17 14c2.5 0 5 1.5 5 4"/></svg> Users</a>
    </nav>
    <div class="admin-sidebar__account">
      <span id="admin-name">...</span>
      <button data-admin-logout aria-label="Log out" title="Log out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1 id="form-title">Add New Problem</h1>
      <a href="dashboard.html" class="btn btn--secondary">← Back to list</a>
    </div>

    <form id="problem-form" class="admin-form">
      <div class="form-row">
        <div class="field">
          <label for="problem-type">Type</label>
          <select id="problem-type">
            <option value="bug">Fix the Bug</option>
            <option value="question">Predict Output</option>
          </select>
        </div>
        <div class="field">
          <label for="problem-difficulty-input">Difficulty</label>
          <select id="problem-difficulty-input">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="problem-title-input">Title</label>
        <input type="text" id="problem-title-input" required placeholder="e.g. Off-by-one loop error">
      </div>

      <div class="field">
        <label for="problem-description">Description</label>
        <textarea id="problem-description" style="min-height:80px" placeholder="What the user needs to do..."></textarea>
      </div>

      <div class="form-row">
        <div class="field">
          <label for="problem-topic-input">Topic</label>
          <input type="text" id="problem-topic-input" placeholder="e.g. loops, oop, recursion">
        </div>
        <div class="field checkbox-field" style="align-self:end;padding-bottom:10px">
          <input type="checkbox" id="problem-premium">
          <label for="problem-premium" style="margin:0">Mark as Premium</label>
        </div>
      </div>

      <div class="field">
        <label id="starter-code-label" for="starter-code">Code</label>
        <textarea id="starter-code" required placeholder="def example():&#10;    pass"></textarea>
      </div>

      <div class="field" id="solution-code-field">
        <label for="solution-code">Solution code (fully correct/fixed code — used by "Use a Hint" for bug problems)</label>
        <textarea id="solution-code" placeholder="The correct, working version of the code..."></textarea>
      </div>

      <div class="field">
        <label id="expected-output-label" for="expected-output">Expected output</label>
        <textarea id="expected-output" required style="min-height:80px" placeholder="Exact output text..."></textarea>
      </div>

      <div class="field">
        <label>Hints</label>
        <div id="hints-container"></div>
        <button type="button" id="add-hint-btn" class="btn btn--secondary btn--sm">+ Add hint</button>
      </div>

      <button type="submit" class="btn btn--primary">Save Problem</button>
    </form>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/utils.js"></script>
<script src="js/admin-common.js"></script>
<script src="js/admin-problem-form.js"></script>
</body>
</html>
