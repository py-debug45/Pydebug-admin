<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d111a">
<meta name="robots" content="noindex, nofollow">
<title>Add/Edit Problem — PyDebug Admin</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-protected admin-panel-locked">

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-sidebar__logo">&gt;_ PyDebug</div>
    <div class="admin-sidebar__tag">ADMIN PANEL</div>
    <nav></nav>
    <div class="admin-sidebar__account">
      <span id="admin-name">...</span>
      <button data-admin-logout aria-label="Log out" title="Log out">⇥</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1 id="form-title">Add New Problem</h1>
      <a href="dashboard.html" class="btn btn--secondary">← Back to list</a>
    </div>

    <form id="problem-form" class="admin-form">
      <div class="form-row">
        <div class="field">
          <label for="problem-type">Type</label>
          <select id="problem-type">
            <option value="bug">Fix the Bug</option>
            <option value="question">Predict Output</option>
            <option value="coding">Write Code (Test Cases)</option>
          </select>
        </div>
        <div class="field">
          <label for="problem-difficulty-input">Difficulty</label>
          <select id="problem-difficulty-input">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
        <div class="field">
          <label for="problem-status-input">Status</label>
          <select id="problem-status-input">
            <option value="published">Published</option>
            <option value="draft">Draft</option>
            <option value="archived">Archived</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="field" style="flex:2">
          <label for="problem-title-input">Title (English)</label>
          <input type="text" id="problem-title-input" required placeholder="e.g. Off-by-one loop error">
        </div>
        <div class="field" style="flex:1">
          <label for="problem-slug-input">URL Slug</label>
          <input type="text" id="problem-slug-input" placeholder="auto-generated-from-title">
        </div>
      </div>

      <div class="field">
        <label for="problem-description">Description (English)</label>
        <textarea id="problem-description" style="min-height:80px" placeholder="What the user needs to do..."></textarea>
      </div>

      <div class="form-row">
        <div class="field">
          <label for="problem-topic-input">Topic</label>
          <select id="problem-topic-input">
            <option value="loops">Loops</option>
            <option value="strings">Strings</option>
            <option value="lists">Lists</option>
            <option value="dictionaries">Dictionaries</option>
            <option value="functions">Functions</option>
            <option value="oop">OOP</option>
            <option value="recursion">Recursion</option>
            <option value="exceptions">Exceptions</option>
            <option value="sets">Sets</option>
            <option value="sorting">Sorting</option>
            <option value="generators">Generators</option>
            <option value="tuples">Tuples</option>
          </select>
        </div>
        <div class="field">
          <label for="problem-number-input">Problem number</label>
          <input type="number" id="problem-number-input" min="1" step="1" placeholder="e.g. 120">
        </div>
        <div class="field">
          <label for="problem-battle-error">Error class (optional)</label>
          <input type="text" id="problem-battle-error" placeholder="e.g. IndexError, TypeError">
        </div>
      </div>

      <div class="form-row" style="margin-bottom:12px">
        <div class="field checkbox-field">
          <input type="checkbox" id="problem-premium">
          <label for="problem-premium" style="margin:0">Mark as Premium ⭐</label>
        </div>
        <div class="field checkbox-field">
          <input type="checkbox" id="problem-skip-notif">
          <label for="problem-skip-notif" style="margin:0">Quiet publish (skip bell/push blast to all users)</label>
        </div>
      </div>

      <div class="field">
        <label id="starter-code-label" for="starter-code">Code</label>
        <textarea id="starter-code" required placeholder="def example():&#10;    pass"></textarea>
      </div>

      <div class="field">
        <label id="expected-output-label" for="expected-output">Expected output</label>
        <textarea id="expected-output" required style="min-height:80px" placeholder="Exact output text..."></textarea>
      </div>

      <div class="field" id="test-cases-field" style="display:none">
        <label for="problem-test-cases">Test cases JSON (for Write Code judge)</label>
        <textarea id="problem-test-cases" class="mono" style="min-height:110px" placeholder='[{"call": "solve([1, 2, 3])", "expected": "6"}, {"call": "solve([])", "expected": "0"}]'></textarea>
      </div>

      <div class="field">
        <label for="problem-solution-code">Reference solution code (optional)</label>
        <textarea id="problem-solution-code" class="mono" style="min-height:90px" placeholder="Clean reference Python solution for AI Teacher / editorial..."></textarea>
      </div>

      <div class="field">
        <label>Hints (English)</label>
        <div id="hints-container"></div>
        <button type="button" id="add-hint-btn" class="btn btn--secondary btn--sm">+ Add hint</button>
      </div>

      <details class="section-card" style="margin:18px 0;padding:14px 16px">
        <summary style="cursor:pointer;font-weight:600">🇮🇳 Hindi / Hinglish Translation (optional)</summary>
        <div style="margin-top:12px">
          <div class="field">
            <label for="problem-title-hi">Title (Hindi / Hinglish)</label>
            <input type="text" id="problem-title-hi" placeholder="उदा. लूप में IndexError ठीक करें">
          </div>
          <div class="field">
            <label for="problem-description-hi">Description (Hindi / Hinglish)</label>
            <textarea id="problem-description-hi" style="min-height:70px" placeholder="यूज़र को क्या ठीक करना है..."></textarea>
          </div>
          <div class="field">
            <label for="problem-hints-hi">Hints in Hindi (one per line)</label>
            <textarea id="problem-hints-hi" style="min-height:80px" placeholder="Hint 1&#10;Hint 2&#10;Hint 3"></textarea>
          </div>
        </div>
      </details>

      <button type="submit" class="btn btn--primary">Save Problem</button>
    </form>
  </main>
</div>

<script src="js/vendor/supabase.min.js" defer></script>
<script src="js/admin-boot.js" defer></script>
<script src="js/supabaseClient.js" defer></script>
<script src="js/utils.js" defer></script>
<script src="js/admin-icons.js" defer></script>
<script src="js/admin-common.js" defer></script>
<script src="js/admin-command.js" defer></script>
<script src="js/admin-problem-form.js" defer></script>
</body>
</html>
