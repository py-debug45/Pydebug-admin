<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d111a">
<meta name="robots" content="noindex, nofollow">
<title>Set a new password — PyDebug Admin</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card auth-card--wide">
    <h1>Set a new password</h1>
    <p class="subtitle">For your PyDebug admin account.</p>

    <div class="auth-alert" id="reset-alert" role="alert" aria-live="assertive" hidden>
      <strong class="auth-alert__title" id="reset-alert-title"></strong>
      <p class="auth-alert__message" id="reset-alert-message"></p>
      <ul class="auth-alert__steps" id="reset-alert-steps"></ul>
    </div>

    <p id="reset-checking" class="subtitle">Checking your recovery link…</p>

    <form id="reset-form" novalidate hidden>
      <div class="field">
        <label for="new-password">New password</label>
        <div class="password-field">
          <input type="password" id="new-password" required minlength="6"
                 autocomplete="new-password" placeholder="At least 6 characters">
          <button type="button" class="password-toggle-btn" data-toggle-password aria-label="Show password">Show</button>
        </div>
      </div>
      <div class="field">
        <label for="confirm-password">Confirm new password</label>
        <input type="password" id="confirm-password" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn--primary btn--full" id="reset-submit">Save password</button>
    </form>

    <p class="auth-switch"><a href="index.html">← Back to login</a></p>
  </div>
</div>

<script src="js/vendor/supabase.min.js" defer></script>
<script src="js/admin-boot.js" defer></script>
<script src="js/supabaseClient.js" defer></script>
<script src="js/admin-icons.js" defer></script>
<script src="js/utils.js" defer></script>
<script src="js/admin-reset.js" defer></script>
</body>
</html>
